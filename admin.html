<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>ניהול תפריט | La Colina</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #262018;
        --muted: #746b5f;
        --paper: #f6f1e8;
        --card: #fffdf8;
        --line: #ded5c7;
        --brand: #714737;
        --brand-dark: #523126;
        --success: #24734d;
        --danger: #9b352d;
        font-family: Arial, "Noto Sans Hebrew", sans-serif;
      }

      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; color: var(--ink); background: var(--paper); }
      button, input, textarea, select { font: inherit; }
      button { cursor: pointer; }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px clamp(16px, 4vw, 42px);
        background: rgba(246, 241, 232, 0.96);
        border-bottom: 1px solid var(--line);
        backdrop-filter: blur(12px);
      }

      .brand { display: flex; align-items: center; gap: 12px; }
      .brand img { width: 44px; height: 44px; object-fit: contain; }
      .brand strong { display: block; font-size: 1.05rem; }
      .brand span { color: var(--muted); font-size: 0.88rem; }
      .top-actions { display: flex; align-items: center; gap: 10px; }

      .btn {
        min-height: 44px;
        padding: 0 18px;
        border: 1px solid var(--line);
        border-radius: 12px;
        color: var(--ink);
        background: var(--card);
        font-weight: 700;
      }
      .btn-primary { color: white; background: var(--brand); border-color: var(--brand); }
      .btn-primary:hover { background: var(--brand-dark); }
      .btn:disabled { cursor: wait; opacity: 0.55; }

      main { width: min(1080px, calc(100% - 32px)); margin: 28px auto 80px; }
      .hero { margin-bottom: 24px; }
      .hero h1 { margin: 0 0 8px; font-size: clamp(1.7rem, 4vw, 2.5rem); }
      .hero p { margin: 0; color: var(--muted); line-height: 1.65; }

      .toolbar {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
        align-items: center;
        margin-bottom: 22px;
      }
      .search {
        width: 100%;
        min-height: 48px;
        padding: 0 16px;
        border: 1px solid var(--line);
        border-radius: 14px;
        color: var(--ink);
        background: var(--card);
      }
      .status { color: var(--muted); font-weight: 700; white-space: nowrap; }
      .status.dirty { color: #a16019; }
      .status.saved { color: var(--success); }

      .section-card {
        margin-bottom: 20px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 20px;
        background: var(--card);
        box-shadow: 0 12px 35px rgba(67, 45, 29, 0.06);
      }
      .section-title { margin: 0; padding: 18px 20px; font-size: 1.2rem; border-bottom: 1px solid var(--line); }
      .item-row {
        display: grid;
        grid-template-columns: minmax(190px, 1fr) minmax(220px, 1.2fr);
        gap: 18px;
        align-items: center;
        padding: 16px 20px;
        border-bottom: 1px solid #ece5da;
      }
      .item-row:last-child { border-bottom: 0; }
      .item-name { font-weight: 700; line-height: 1.4; }
      .item-description { margin-top: 4px; color: var(--muted); font-size: 0.88rem; line-height: 1.45; }
      .price-fields { display: flex; flex-wrap: wrap; justify-content: flex-start; gap: 10px; }
      .price-field { display: grid; gap: 5px; min-width: 88px; }
      .price-field label { color: var(--muted); font-size: 0.8rem; font-weight: 700; }
      .price-input-wrap { position: relative; }
      .price-input {
        width: 100%;
        min-height: 44px;
        padding: 0 12px 0 30px;
        border: 1px solid var(--line);
        border-radius: 11px;
        color: var(--ink);
        background: white;
        font-weight: 700;
      }
      .price-input:focus { outline: 3px solid rgba(113, 71, 55, 0.15); border-color: var(--brand); }
      .currency { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); }

      .manager-actions { display: flex; flex-wrap: wrap; gap: 10px; margin: -8px 0 22px; }
      .section-manager-header { display: flex; align-items: end; gap: 12px; padding: 18px 20px; border-bottom: 1px solid var(--line); background: #fbf7f0; }
      .section-manager-header .editor-field { flex: 1; }
      .section-items { display: grid; gap: 14px; padding: 16px; }
      .item-editor { padding: 16px; border: 1px solid #e4dbce; border-radius: 16px; background: white; }
      .item-editor-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
      .item-editor-title { margin: 0; font-size: 1rem; }
      .item-actions { display: flex; flex-wrap: wrap; gap: 7px; }
      .icon-action { min-width: 42px; min-height: 40px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 9px; background: #f8f3eb; color: var(--ink); font-weight: 700; }
      .icon-action.danger { color: var(--danger); border-color: #e4bab6; background: #fff5f4; }
      .icon-action:disabled { cursor: default; opacity: .38; }
      .editor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .editor-field { display: grid; gap: 6px; }
      .editor-field.full { grid-column: 1 / -1; }
      .editor-field > span, .editor-field > label { color: var(--muted); font-size: .88rem; font-weight: 700; }
      .editor-input, .editor-textarea, .editor-select {
        width: 100%;
        min-height: 44px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        color: var(--ink);
        background: white;
      }
      .editor-textarea { min-height: 82px; resize: vertical; line-height: 1.5; }
      .editor-input:focus, .editor-textarea:focus, .editor-select:focus { outline: 3px solid rgba(113, 71, 55, .15); border-color: var(--brand); }
      .pricing-editor { display: grid; gap: 10px; grid-column: 1 / -1; padding-top: 4px; }
      .pricing-row { display: grid; grid-template-columns: minmax(110px, 1fr) minmax(88px, .6fr) auto; gap: 8px; align-items: end; }
      .add-item-button { width: 100%; min-height: 48px; border: 1px dashed var(--brand); border-radius: 12px; background: #fffaf3; color: var(--brand); font-weight: 800; }
      .empty-section { margin: 4px 0; padding: 18px; border: 1px dashed var(--line); border-radius: 12px; color: var(--muted); text-align: center; }

      .login-shell { display: grid; min-height: 100vh; place-items: center; padding: 24px; }
      .login-card {
        width: min(460px, 100%);
        padding: 30px;
        border: 1px solid var(--line);
        border-radius: 24px;
        background: var(--card);
        box-shadow: 0 24px 70px rgba(67, 45, 29, 0.12);
      }
      .login-logo { width: 72px; height: 72px; object-fit: contain; display: block; margin: 0 auto 16px; }
      .login-card h1 { margin: 0 0 8px; text-align: center; }
      .login-card > p { margin: 0 0 24px; color: var(--muted); text-align: center; line-height: 1.6; }
      .token-label { display: grid; gap: 8px; font-weight: 700; }
      .token-input { width: 100%; min-height: 48px; padding: 0 14px; border: 1px solid var(--line); border-radius: 12px; direction: ltr; }
      .remember { display: flex; align-items: center; gap: 9px; margin: 14px 0 20px; color: var(--muted); }
      .login-card .btn { width: 100%; }
      .help { margin-top: 18px; color: var(--muted); font-size: 0.84rem; line-height: 1.55; }
      .error { min-height: 22px; margin: 12px 0 0; color: var(--danger); font-size: 0.9rem; font-weight: 700; }
      .hidden { display: none !important; }

      .toast {
        position: fixed;
        right: 50%;
        bottom: 22px;
        z-index: 30;
        transform: translateX(50%) translateY(16px);
        max-width: min(460px, calc(100% - 32px));
        padding: 13px 18px;
        border-radius: 13px;
        color: white;
        background: var(--success);
        opacity: 0;
        pointer-events: none;
        transition: 180ms ease;
        box-shadow: 0 12px 34px rgba(0, 0, 0, 0.18);
      }
      .toast.show { opacity: 1; transform: translateX(50%) translateY(0); }
      .toast.error-toast { background: var(--danger); }

      @media (max-width: 680px) {
        .topbar { align-items: flex-start; }
        .brand span { display: none; }
        .top-actions { flex-direction: column-reverse; align-items: stretch; }
        .top-actions .btn { min-height: 38px; padding: 0 12px; font-size: 0.86rem; }
        .toolbar { grid-template-columns: 1fr; }
        .item-row { grid-template-columns: 1fr; gap: 12px; }
        .price-fields { justify-content: stretch; }
        .price-field { flex: 1 1 92px; }
        .section-manager-header { align-items: stretch; flex-direction: column; }
        .section-manager-header .btn { width: 100%; }
        .editor-grid { grid-template-columns: 1fr; }
        .editor-field.full, .pricing-editor { grid-column: 1; }
        .pricing-row { grid-template-columns: 1fr 1fr; }
        .pricing-row .icon-action { grid-column: 1 / -1; }
      }
    </style>
  </head>
  <body>
    <section class="login-shell" id="loginView">
      <form class="login-card" id="loginForm">
        <img class="login-logo" src="la-colina-logo.webp" alt="La Colina" />
        <h1>ניהול תפריט</h1>
        <p>הכניסה מיועדת למנהל התפריט בלבד.</p>
        <label class="token-label">
          סיסמה
          <input class="token-input" id="tokenInput" type="password" autocomplete="current-password" required />
        </label>
        <label class="remember">
          <input id="rememberToken" type="checkbox" />
          לזכור אותי במכשיר הזה
        </label>
        <button class="btn btn-primary" id="loginButton" type="submit">כניסה למערכת</button>
        <p class="error" id="loginError" role="alert"></p>
        <div class="help">הסיסמה נבדקת בצורה מאובטחת בצד השרת ואינה נשמרת בדפדפן.</div>
      </form>
    </section>

    <div class="hidden" id="adminView">
      <header class="topbar">
        <div class="brand">
          <img src="la-colina-logo.webp" alt="" />
          <div><strong>La Colina</strong><span>מנהל התפריט</span></div>
        </div>
        <div class="top-actions">
          <button class="btn" id="logoutButton" type="button">יציאה</button>
          <button class="btn btn-primary" id="saveButton" type="button" disabled>שמירת שינויים</button>
      </header>

      <main>
        <div class="hero">
          <h1>ניהול התפריט</h1>
          <p>אפשר לערוך מנות ומחירים, להוסיף או למחוק פריטים וקטגוריות ולשנות את הסדר. בסיום לוחצים על “שמירת שינויים”.</p>
        </div>
        <div class="toolbar">
          <input class="search" id="searchInput" type="search" placeholder="חיפוש מוצר או קטגוריה…" />
          <span class="status" id="saveStatus">הכול מעודכן</span>
        </div>
        <div class="manager-actions">
          <button class="btn" id="addFoodSection" type="button">הוספת קטגוריית אוכל</button>
          <button class="btn" id="addWineSection" type="button">הוספת קטגוריית שתייה</button>
        </div>
        <div id="menuEditor"></div>
      </main>
    </div>

    <div class="toast" id="toast" role="status"></div>

    <script>
      const API_URL = "https://la-colina-menu-service.oribra.chatgpt.site";

      const loginView = document.querySelector("#loginView");
      const adminView = document.querySelector("#adminView");
      const loginForm = document.querySelector("#loginForm");
      const loginButton = document.querySelector("#loginButton");
      const loginError = document.querySelector("#loginError");
      const tokenInput = document.querySelector("#tokenInput");
      const rememberToken = document.querySelector("#rememberToken");
      const editor = document.querySelector("#menuEditor");
      const searchInput = document.querySelector("#searchInput");
      const saveButton = document.querySelector("#saveButton");
      const saveStatus = document.querySelector("#saveStatus");
      const toast = document.querySelector("#toast");

      let accessToken = localStorage.getItem("laColinaAdminToken") || sessionStorage.getItem("laColinaAdminToken") || "";
      let menuData = null;
      let isDirty = false;
      let toastTimer;

      function showToast(message, error = false) {
        clearTimeout(toastTimer);
        toast.textContent = message;
        toast.classList.toggle("error-toast", error);
        toast.classList.add("show");
        toastTimer = setTimeout(() => toast.classList.remove("show"), 3200);
      }

      function setDirty(dirty) {
        isDirty = dirty;
        saveButton.disabled = !dirty;
        saveStatus.textContent = dirty ? "יש שינויים שלא נשמרו" : "הכול מעודכן";
        saveStatus.className = `status ${dirty ? "dirty" : "saved"}`;
      }

      async function loadMenu() {
        const response = await fetch(`${API_URL}/menu?t=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) {
          throw new Error("לא הצלחנו לטעון את התפריט. נסו שוב בעוד רגע.");
        }
        const result = await response.json();
        menuData = result.menu;
      }

      function createPriceField(label, value, onChange) {
        const field = document.createElement("div");
        field.className = "price-field";
        const labelElement = document.createElement("label");
        labelElement.textContent = label;
        const wrap = document.createElement("div");
        wrap.className = "price-input-wrap";
        const input = document.createElement("input");
        input.className = "price-input";
        input.type = "number";
        input.inputMode = "decimal";
        input.min = "0";
        input.step = "1";
        input.value = value;
        input.setAttribute("aria-label", label);
        input.addEventListener("input", () => {
          const number = Number(input.value);
          if (!Number.isFinite(number) || number < 0) return;
          onChange(number);
          setDirty(true);
        });
        const currency = document.createElement("span");
        currency.className = "currency";
        currency.textContent = "₪";
        wrap.append(input, currency);
        field.append(labelElement, wrap);
        return field;
      }

      function createTextField(label, value, onChange, options = {}) {
        const field = document.createElement("label");
        field.className = `editor-field${options.full ? " full" : ""}`;
        const caption = document.createElement("span");
        caption.textContent = label;
        const input = document.createElement(options.textarea ? "textarea" : "input");
        input.className = options.textarea ? "editor-textarea" : "editor-input";
        if (!options.textarea) input.type = "text";
        input.value = value || "";
        input.placeholder = options.placeholder || "";
        input.addEventListener("input", () => {
          onChange(input.value);
          setDirty(true);
        });
        field.append(caption, input);
        return field;
      }

      function createSelectField(label, value, options, onChange) {
        const field = document.createElement("label");
        field.className = "editor-field";
        const caption = document.createElement("span");
        caption.textContent = label;
        const select = document.createElement("select");
        select.className = "editor-select";
        options.forEach((option) => {
          const element = document.createElement("option");
          element.value = option.value;
          element.textContent = option.label;
          element.selected = option.value === value;
          select.append(element);
        });
        select.addEventListener("change", () => {
          onChange(select.value);
          setDirty(true);
        });
        field.append(caption, select);
        return field;
      }

      function createActionButton(text, handler, options = {}) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `icon-action${options.danger ? " danger" : ""}`;
        button.textContent = text;
        button.disabled = Boolean(options.disabled);
        if (options.label) button.setAttribute("aria-label", options.label);
        button.addEventListener("click", handler);
        return button;
      }

      function priceMode(item) {
        if (Array.isArray(item.prices)) return "labeled";
        if (Array.isArray(item.priceOptions)) return "options";
        return "single";
      }

      function changePriceMode(item, mode) {
        delete item.price;
        delete item.prices;
        delete item.priceOptions;
        if (mode === "single") item.price = 0;
        if (mode === "labeled") item.prices = [{ label: "מחיר", value: 0 }];
        if (mode === "options") item.priceOptions = [0];
      }

      function refreshEditor() {
        setDirty(true);
        renderEditor(searchInput.value);
      }

      function renderPricing(item, container) {
        const mode = priceMode(item);
        container.append(createSelectField("סוג מחיר", mode, [
          { value: "single", label: "מחיר יחיד" },
          { value: "labeled", label: "מחירים עם שם (למשל כוס / בקבוק)" },
          { value: "options", label: "כמה גדלים ללא שם" },
        ], (nextMode) => {
          changePriceMode(item, nextMode);
          refreshEditor();
        }));

        const pricing = document.createElement("div");
        pricing.className = "pricing-editor";

        if (mode === "single") {
          pricing.append(createPriceField(item.priceLabel || "מחיר", item.price ?? 0, (value) => { item.price = value; }));
        }

        if (mode === "labeled") {
          item.prices.forEach((price, index) => {
            const row = document.createElement("div");
            row.className = "pricing-row";
            row.append(
              createTextField("שם האפשרות", price.label, (value) => { price.label = value; }),
              createPriceField("מחיר", price.value, (value) => { price.value = value; }),
              createActionButton("מחיקה", () => {
                item.prices.splice(index, 1);
                refreshEditor();
              }, { danger: true, disabled: item.prices.length === 1, label: `מחיקת אפשרות מחיר ${index + 1}` }),
            );
            pricing.append(row);
          });
          pricing.append(createActionButton("הוספת אפשרות מחיר", () => {
            item.prices.push({ label: "אפשרות חדשה", value: 0 });
            refreshEditor();
          }));
        }

        if (mode === "options") {
          item.priceOptions.forEach((price, index) => {
            const row = document.createElement("div");
            row.className = "pricing-row";
            row.append(
              createPriceField(`אפשרות ${index + 1}`, price, (value) => { item.priceOptions[index] = value; }),
              createActionButton("מחיקה", () => {
                item.priceOptions.splice(index, 1);
                refreshEditor();
              }, { danger: true, disabled: item.priceOptions.length === 1, label: `מחיקת מחיר ${index + 1}` }),
            );
            pricing.append(row);
          });
          pricing.append(createActionButton("הוספת מחיר נוסף", () => {
            item.priceOptions.push(0);
            refreshEditor();
          }));
        }

        container.append(pricing);
      }

      function addItem(section) {
        section.items.push({ name: "מנה חדשה", description: "", price: 0 });
        searchInput.value = "";
        refreshEditor();
      }

      function addSection(view) {
        const section = {
          id: `${view}-${Date.now()}`,
          title: "קטגוריה חדשה",
          eyebrow: "MENU",
          accent: view === "food" ? "#b58b50" : "#762f37",
          items: [],
        };
        if (view === "wine") section.group = "soft";
        menuData[view].push(section);
        searchInput.value = "";
        refreshEditor();
      }

      function renderEditor(filter = "") {
        editor.replaceChildren();
        const query = filter.trim().toLowerCase();
        const fragment = document.createDocumentFragment();

        Object.entries(menuData).forEach(([view, sections]) => sections.forEach((section) => {
          const sectionMatches = section.title.toLowerCase().includes(query);
          const matchingItems = !query || sectionMatches
            ? section.items
            : section.items.filter((item) => `${item.name} ${item.description || ""} ${(item.badges || []).join(" ")}`.toLowerCase().includes(query));
          if (query && !sectionMatches && !matchingItems.length) return;

          const card = document.createElement("section");
          card.className = "section-card";
          const header = document.createElement("div");
          header.className = "section-manager-header";
          header.append(createTextField("שם הקטגוריה", section.title, (value) => { section.title = value; }));
          if (view === "wine") {
            header.append(createSelectField("קבוצת תפריט", section.group || "soft", [
              { value: "wines", label: "יין" },
              { value: "alcohol", label: "בירה ואלכוהול" },
              { value: "soft", label: "קפה ושתייה קלה" },
            ], (value) => { section.group = value; }));
          }
          header.append(createActionButton("מחיקת קטגוריה", () => {
            if (!window.confirm(`למחוק את הקטגוריה “${section.title}” ואת כל המנות שבה?`)) return;
            sections.splice(sections.indexOf(section), 1);
            refreshEditor();
          }, { danger: true }));
          card.append(header);

          const itemsContainer = document.createElement("div");
          itemsContainer.className = "section-items";

          matchingItems.forEach((item) => {
            const itemIndex = section.items.indexOf(item);
            const itemCard = document.createElement("article");
            itemCard.className = "item-editor";
            const itemHeader = document.createElement("div");
            itemHeader.className = "item-editor-header";
            const itemTitle = document.createElement("h3");
            itemTitle.className = "item-editor-title";
            itemTitle.textContent = item.name || "מנה ללא שם";
            const itemActions = document.createElement("div");
            itemActions.className = "item-actions";
            itemActions.append(
              createActionButton("↑", () => {
                [section.items[itemIndex - 1], section.items[itemIndex]] = [section.items[itemIndex], section.items[itemIndex - 1]];
                refreshEditor();
              }, { disabled: itemIndex === 0, label: "העברת המנה למעלה" }),
              createActionButton("↓", () => {
                [section.items[itemIndex], section.items[itemIndex + 1]] = [section.items[itemIndex + 1], section.items[itemIndex]];
                refreshEditor();
              }, { disabled: itemIndex === section.items.length - 1, label: "העברת המנה למטה" }),
              createActionButton("מחיקה", () => {
                if (!window.confirm(`למחוק את המנה “${item.name}”?`)) return;
                section.items.splice(itemIndex, 1);
                refreshEditor();
              }, { danger: true }),
            );
            itemHeader.append(itemTitle, itemActions);

            const grid = document.createElement("div");
            grid.className = "editor-grid";
            grid.append(
              createTextField("שם המנה", item.name, (value) => {
                item.name = value;
                itemTitle.textContent = value || "מנה ללא שם";
              }),
              createTextField("תגיות (מופרדות בפסיק)", (item.badges || []).join(", "), (value) => {
                item.badges = value.split(",").map((badge) => badge.trim()).filter(Boolean);
              }, { placeholder: "טבעוני, ללא גלוטן" }),
              createTextField("תיאור", item.description || "", (value) => { item.description = value; }, { textarea: true, full: true }),
            );
            renderPricing(item, grid);
            itemCard.append(itemHeader, grid);
            itemsContainer.append(itemCard);
          });
          if (!matchingItems.length) {
            const empty = document.createElement("p");
            empty.className = "empty-section";
            empty.textContent = "הקטגוריה עדיין ריקה.";
            itemsContainer.append(empty);
          }
          if (!query) {
            const addButton = document.createElement("button");
            addButton.type = "button";
            addButton.className = "add-item-button";
            addButton.textContent = "הוספת מנה לקטגוריה";
            addButton.addEventListener("click", () => addItem(section));
            itemsContainer.append(addButton);
          }
          card.append(itemsContainer);
          fragment.append(card);
        }));

        if (!fragment.childNodes.length) {
          const empty = document.createElement("p");
          empty.textContent = "לא נמצאו פריטים מתאימים.";
          editor.append(empty);
        } else {
          editor.append(fragment);
        }
      }

      function validateMenu() {
        Object.values(menuData).flat().forEach((section) => {
          if (!section.title.trim()) throw new Error("יש קטגוריה ללא שם.");
          section.items.forEach((item) => {
            if (!item.name.trim()) throw new Error(`יש מנה ללא שם בקטגוריה “${section.title}”.`);
          });
        });
      }

      async function showAdmin(token, remember) {
        accessToken = token;
        if (remember) localStorage.setItem("laColinaAdminToken", token);
        else sessionStorage.setItem("laColinaAdminToken", token);
        await loadMenu();
        loginView.classList.add("hidden");
        adminView.classList.remove("hidden");
        renderEditor();
        setDirty(false);
      }

      async function enterAdmin(password, remember) {
        loginButton.disabled = true;
        loginButton.textContent = "מתחבר…";
        loginError.textContent = "";
        try {
          const response = await fetch(`${API_URL}/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ password }),
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || "הסיסמה שגויה.");
          tokenInput.value = "";
          await showAdmin(result.token, remember);
        } catch (error) {
          loginError.textContent = error.message;
          localStorage.removeItem("laColinaAdminToken");
          sessionStorage.removeItem("laColinaAdminToken");
        } finally {
          loginButton.disabled = false;
          loginButton.textContent = "כניסה למערכת";
        }
      }

      loginForm.addEventListener("submit", (event) => {
        event.preventDefault();
        enterAdmin(tokenInput.value.trim(), rememberToken.checked);
      });

      searchInput.addEventListener("input", () => renderEditor(searchInput.value));
      document.querySelector("#addFoodSection").addEventListener("click", () => addSection("food"));
      document.querySelector("#addWineSection").addEventListener("click", () => addSection("wine"));

      saveButton.addEventListener("click", async () => {
        if (!isDirty) return;
        saveButton.disabled = true;
        saveButton.textContent = "שומר…";
        try {
          validateMenu();
          const response = await fetch(`${API_URL}/menu`, {
            method: "PUT",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${accessToken}`,
            },
            body: JSON.stringify({ menu: menuData }),
          });
          const result = await response.json();
          if (!response.ok) {
            if (response.status === 401) {
              localStorage.removeItem("laColinaAdminToken");
              sessionStorage.removeItem("laColinaAdminToken");
            }
            throw new Error(result.error || "השמירה נכשלה. נסו שוב בעוד רגע.");
          }
          setDirty(false);
          showToast("התפריט נשמר בהצלחה");
        } catch (error) {
          showToast(error.message, true);
          saveButton.disabled = false;
        } finally {
          saveButton.textContent = "שמירת שינויים";
        }
      });

      document.querySelector("#logoutButton").addEventListener("click", () => {
        localStorage.removeItem("laColinaAdminToken");
        sessionStorage.removeItem("laColinaAdminToken");
        location.reload();
      });

      window.addEventListener("beforeunload", (event) => {
        if (!isDirty) return;
        event.preventDefault();
        event.returnValue = "";
      });

      if (accessToken) {
        showAdmin(accessToken, Boolean(localStorage.getItem("laColinaAdminToken"))).catch(() => {
          localStorage.removeItem("laColinaAdminToken");
          sessionStorage.removeItem("laColinaAdminToken");
          location.reload();
        });
      }
    </script>
  </body>
</html>
